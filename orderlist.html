<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Order List</title>
  <style>
    h1 { text-align: center; }
    table { margin: 0 auto; border-collapse: collapse; width: 600px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    a { display: block; text-align: center; margin-top: 20px; }
    button { padding: 8px 14px; }
  </style>
</head>
<body>
  <h1>Order List</h1>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>상품명</th>
        <th>가격</th>
        <th>주문</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>

  <a href="/"><button type="button">메인으로 돌아가기</button></a>

  <script>
    fetch("/products")
      .then(res => res.json())
      .then(items => {
        const tbody = document.getElementById("list");
        tbody.innerHTML = items.map(p => `
          <tr>
            <td>${p.id}</td>
            <td>${p.name}</td>
            <td>${p.price.toLocaleString()}원</td>
            <td><a href="/order?productId=${p.id}"><button type="button">order</button></a></td>
          </tr>
        `).join("");
      });
  </script>
</body>
</html>
